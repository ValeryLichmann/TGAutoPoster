<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>AutoScanner — промо reels</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05070f;
        font-family: "Inter", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      :root { --blue: #1fa2ff; --blue-lite: #6fd0ff; --white: #ffffff; --muted: #93a6c4; --orange: #f5a623; }

      /* SAFE ZONES (Instagram Reels): keep all TEXT within y ∈ [250, 1500].
         Top ~250px and bottom ~420px are covered by IG UI (caption, buttons). */

      /* ---------- background ---------- */
      #bg { background: radial-gradient(120% 90% at 50% 34%, #10203f 0%, #0a1224 42%, #05070f 100%); }
      #glow { position: absolute; left: 50%; top: 46%; width: 1400px; height: 1400px; transform: translate(-50%, -50%);
        border-radius: 50%; background: radial-gradient(circle, rgba(31,162,255,0.30) 0%, rgba(31,162,255,0.10) 30%, rgba(31,162,255,0) 62%); filter: blur(6px); }
      #grain { position: absolute; inset: 0; opacity: 0.06; background-image: radial-gradient(rgba(255,255,255,0.7) 1px, transparent 1px); background-size: 4px 4px; }

      /* ---------- scene A : HOOK over real auto24 footage ---------- */
      #hookStage { position: absolute; inset: 0; z-index: 3; overflow: hidden; }
      #s1video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
      #s1shade { position: absolute; inset: 0; background:
        linear-gradient(180deg, rgba(5,8,20,0.78) 0%, rgba(5,8,20,0.60) 40%, rgba(5,8,20,0.84) 100%); }
      #hookBackglow { position: absolute; left: 50%; top: 720px; transform: translate(-50%, -50%);
        width: 1080px; height: 720px; z-index: 1;
        background: radial-gradient(52% 46% at 50% 50%, rgba(3,6,15,0.86) 0%, rgba(3,6,15,0.45) 55%, rgba(3,6,15,0) 78%); }
      #hookText { position: absolute; left: 60px; right: 60px; top: 560px; text-align: center; z-index: 2; }
      .hook-l { font-size: 100px; font-weight: 800; color: var(--white); line-height: 1.04; letter-spacing: -2px;
        text-shadow: 0 6px 40px rgba(0,0,0,0.6); }
      .hook-row { display: flex; align-items: center; justify-content: center; gap: 26px; margin-top: 6px; }
      .hook-row .rw { font-size: 100px; font-weight: 800; color: var(--white); line-height: 1.04; letter-spacing: -2px;
        text-shadow: 0 6px 40px rgba(0,0,0,0.6); }
      .a24chip { background: #fff; border-radius: 20px; padding: 16px 30px; display: inline-flex; align-items: center;
        box-shadow: 0 10px 34px rgba(0,0,0,0.45); }
      .a24chip img { height: 66px; display: block; }
      .hook-sub { margin-top: 40px; font-size: 52px; font-weight: 800; color: var(--blue-lite);
        text-shadow: 0 2px 24px rgba(0,0,0,0.7); }

      /* ---------- scene B : phone demo ---------- */
      #phoneStage { position: absolute; inset: 0; z-index: 5; }
      #phone { position: absolute; left: 50%; top: 50%; width: 700px; height: 1244px;
        background: #05070f; border-radius: 68px; padding: 18px;
        box-shadow: 0 40px 120px rgba(0,0,0,0.6), 0 0 0 3px #223a5e, 0 0 90px rgba(31,162,255,0.35); }
      #phone .screen { position: absolute; inset: 18px; border-radius: 52px; overflow: hidden; background: #000; }
      #phone .screen video { width: 100%; height: 100%; object-fit: cover; display: block; }
      #phone .notch { position: absolute; top: 34px; left: 50%; transform: translateX(-50%); width: 172px; height: 34px;
        background: #05070f; border-radius: 20px; z-index: 4; }
      .rip { position: absolute; width: 128px; height: 128px; margin: -64px 0 0 -64px; border-radius: 50%;
        border: 5px solid var(--blue); opacity: 0; z-index: 6; box-shadow: 0 0 34px rgba(31,162,255,0.85), inset 0 0 18px rgba(31,162,255,0.4); }
      #rip1, #rip1b { left: 350px; top: 720px; }
      #rip2, #rip2b { left: 350px; top: 892px; }

      /* callouts — all in the TOP safe band (~250–470) */
      .callout { position: absolute; left: 50%; z-index: 8; display: inline-flex; align-items: center; gap: 16px;
        background: rgba(10,20,40,0.92); border: 1.5px solid rgba(31,162,255,0.6); color: var(--white);
        font-size: 40px; font-weight: 700; padding: 20px 32px; border-radius: 22px;
        box-shadow: 0 14px 40px rgba(0,0,0,0.55), 0 0 44px rgba(31,162,255,0.2); white-space: nowrap; }
      .callout .n { display: inline-grid; place-items: center; width: 54px; height: 54px; flex: none; border-radius: 50%;
        background: var(--blue); color: #04101f; font-size: 36px; font-weight: 900; }
      .callout small { display: block; font-size: 28px; color: var(--blue-lite); font-weight: 600; }
      #c1, #c2, #c3 { top: 262px; }
      #stat { position: absolute; left: 50%; top: 402px; z-index: 8; background: rgba(31,162,255,0.18);
        border: 1.5px solid rgba(31,162,255,0.65); color: var(--white); font-size: 36px; font-weight: 800;
        padding: 15px 32px; border-radius: 999px; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }

      /* ---------- scene C : CTA ---------- */
      #ctaWrap { position: absolute; left: 0; right: 0; top: 540px; display: flex; flex-direction: column; align-items: center; }
      #ctaLogo { width: 940px; height: auto; display: block; filter: drop-shadow(0 0 40px rgba(31,162,255,0.35)); }
      .cta { display: flex; flex-direction: column; align-items: center; gap: 26px; margin-top: 20px; }
      .cta .arrow { width: 0; height: 0; border-left: 40px solid transparent; border-right: 40px solid transparent;
        border-bottom: 60px solid var(--blue); filter: drop-shadow(0 0 24px rgba(31,162,255,.7)); }
      .cta .txt { font-size: 66px; font-weight: 800; color: var(--white); text-align: center; }
      .cta .txt b { color: var(--blue); }
      .cta .pill { font-size: 46px; font-weight: 800; color: var(--muted); }
      .cta .pill span { color: var(--white); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="11.0">

      <!-- ============ background ============ -->
      <div id="bg" class="clip" data-start="0" data-duration="11.0" data-track-index="0">
        <div id="glow"></div>
        <div id="grain"></div>
      </div>

      <!-- ============ scene A : HOOK over auto24 footage ============ -->
      <div id="hookStage">
        <video id="s1video" class="clip" src="assets/auto24_intro.mp4" data-start="0" data-duration="2.25" data-track-index="1" muted playsinline></video>
        <div id="s1shade"></div>
        <div id="hookBackglow"></div>
        <div id="hookText">
          <div class="hook-l" id="hk1">Хватит листать</div>
          <div class="hook-row" id="hk2">
            <span class="a24chip"><img src="assets/auto24_logo.png" alt="auto24.ee" /></span>
            <span class="rw">вручную</span>
          </div>
          <div class="hook-sub" id="hksub">Лови новые тачки первым →</div>
        </div>
      </div>

      <!-- ============ scene B : phone demo ============ -->
      <div id="phoneStage">
        <div id="phone">
          <div class="screen">
            <video id="screenVideo" class="clip" src="assets/phone_demo.mp4" data-start="2.5" data-duration="6.35" data-track-index="5" muted playsinline></video>
          </div>
          <div class="notch"></div>
          <div class="rip" id="rip1"></div><div class="rip" id="rip1b"></div>
          <div class="rip" id="rip2"></div><div class="rip" id="rip2b"></div>
        </div>

        <div class="callout" id="c1"><span class="n">1</span><span>Настрой фильтр<small>марка · модель · цена</small></span></div>
        <div class="callout" id="c2"><span class="n">2</span><span>Сохрани<small>за пару секунд</small></span></div>
        <div class="callout" id="c3"><span class="n">3</span><span>Новые объявления — прямо в чат</span></div>
        <div id="stat">Уже 88 объявлений по твоему фильтру</div>
      </div>

      <!-- ============ scene C : CTA ============ -->
      <section id="s4" class="clip" data-start="8.9" data-duration="2.1" data-track-index="10">
        <div id="ctaWrap">
          <img id="ctaLogo" src="assets/logo.png" alt="AutoScanner" />
          <div class="cta" id="ctaBlock">
            <div class="arrow"></div>
            <div class="txt"><b>Ссылка</b> в шапке профиля</div>
            <div class="pill">Telegram · <span>@AutoScannerEEbot</span></div>
          </div>
        </div>
      </section>

      <!-- ============ SFX (offline bundled library) ============ -->
      <audio id="sfxHook"   src="assets/sfx/whoosh-short.mp3"  data-start="0.45" data-duration="0.55" data-track-index="20" data-volume="0.4"></audio>
      <audio id="sfxEnter"  src="assets/sfx/whoosh-short.mp3"  data-start="2.15" data-duration="0.55" data-track-index="21" data-volume="0.5"></audio>
      <audio id="sfxTap1"   src="assets/sfx/click-soft.mp3"    data-start="3.58" data-duration="0.36" data-track-index="22" data-volume="0.6"></audio>
      <audio id="sfxTap2"   src="assets/sfx/click-soft.mp3"    data-start="5.98" data-duration="0.36" data-track-index="23" data-volume="0.6"></audio>
      <audio id="sfxMsg1"   src="assets/sfx/notification.mp3"  data-start="6.85" data-duration="1.10" data-track-index="24" data-volume="0.6"></audio>
      <audio id="sfxMsg2"   src="assets/sfx/pop.mp3"           data-start="7.35" data-duration="0.50" data-track-index="25" data-volume="0.5"></audio>
      <audio id="sfxMsg3"   src="assets/sfx/ping.mp3"          data-start="7.80" data-duration="0.80" data-track-index="26" data-volume="0.45"></audio>
      <audio id="sfxSwap"   src="assets/sfx/whoosh.mp3"        data-start="8.58" data-duration="0.57" data-track-index="27" data-volume="0.55"></audio>
      <audio id="sfxImpact" src="assets/sfx/impact-bass-1.mp3" data-start="8.95" data-duration="1.70" data-track-index="28" data-volume="0.5"></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#glow", { scale: 0.92, opacity: 0.7 }, { scale: 1.12, opacity: 1, duration: 11.0, ease: "sine.inOut" }, 0);

      /* ===== SCENE A : HOOK (from frame 1) over auto24 ===== */
      tl.fromTo("#s1video", { scale: 1.06 }, { scale: 1.16, duration: 2.4, ease: "none" }, 0);
      tl.from("#hk1", { y: 40, autoAlpha: 0, duration: 0.4, ease: "power3.out" }, 0.15);
      tl.from("#hk2", { y: 50, autoAlpha: 0, duration: 0.45, ease: "power3.out" }, 0.5);
      tl.from("#hksub", { y: 30, autoAlpha: 0, scale: 0.92, duration: 0.5, ease: "back.out(1.7)" }, 1.35);
      tl.to("#hookStage", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 2.1);
      tl.set("#hookStage", { autoAlpha: 0 }, 2.5);

      /* ===== SCENE B : phone demo ===== */
      tl.set("#phoneStage", { autoAlpha: 0 }, 0);
      tl.set(["#c1","#c2","#c3","#stat"], { xPercent: -50, autoAlpha: 0 }, 0);
      tl.set("#phone", { xPercent: -50, yPercent: -50, y: 120, scale: 0.9 }, 0);
      tl.to("#phoneStage", { autoAlpha: 1, duration: 0.01 }, 2.45);
      tl.to("#phone", { y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 2.45);

      /* tap 1 (filter) ~3.6 */
      tl.fromTo("#rip1",  { scale: 0.25, autoAlpha: 0.95 }, { scale: 2.0, autoAlpha: 0, duration: 0.9, ease: "power2.out" }, 3.55);
      tl.fromTo("#rip1b", { scale: 0.25, autoAlpha: 0.8 },  { scale: 2.5, autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 3.75);
      tl.fromTo("#c1", { y: -28, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 3.05);
      tl.to("#c1", { autoAlpha: 0, duration: 0.35 }, 4.6);

      /* tap 2 (save) ~6.0 */
      tl.fromTo("#rip2",  { scale: 0.25, autoAlpha: 0.95 }, { scale: 2.0, autoAlpha: 0, duration: 0.9, ease: "power2.out" }, 5.95);
      tl.fromTo("#rip2b", { scale: 0.25, autoAlpha: 0.8 },  { scale: 2.5, autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 6.15);
      tl.fromTo("#c2", { y: -28, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 4.8);
      tl.to("#c2", { autoAlpha: 0, duration: 0.35 }, 6.2);

      /* PAYOFF : chat delivers listings (~6.8) */
      tl.to("#phone", { scale: 1.05, duration: 1.4, ease: "power1.inOut" }, 6.7);
      tl.fromTo("#c3", { y: -28, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 6.6);
      tl.fromTo("#stat", { y: 20, autoAlpha: 0, scale: 0.85 }, { y: 0, autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 7.1);
      tl.to("#phoneStage", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 8.62);

      /* ===== SCENE C : CTA ===== */
      tl.from("#ctaLogo", { y: 40, autoAlpha: 0, scale: 0.9, duration: 0.6, ease: "back.out(1.5)" }, 8.95);
      tl.from("#ctaBlock", { y: 40, autoAlpha: 0, duration: 0.55, ease: "power3.out" }, 9.35);
      tl.to("#ctaBlock .arrow", { y: -18, duration: 0.5, yoyo: true, repeat: 2, ease: "sine.inOut" }, 9.7);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
